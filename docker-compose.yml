# Runs the API and Ollama together.
#   docker compose up --build
#   docker compose exec ollama ollama pull qwen2.5vl:3b   (first time only)
# GPU: needs the NVIDIA Container Toolkit. Remove the "deploy" block to run on CPU.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:3b}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_models:
